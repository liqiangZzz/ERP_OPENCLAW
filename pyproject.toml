[project]
name = "agent"
version = "0.0.1"
description = "ERP procurement assistant built with LangGraph, DeepAgents, FastAPI and MCP."
authors = [
    { name = "William Fu-Hinthorn", email = "13333726+hinthornw@users.noreply.github.com" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"  # deepagents 与 numpy/aiofile/rpds-py 均要求 >=3.11
# range 下界对齐实际运行的 conda 环境；精确复现走 requirements.txt。
dependencies = [
    "deepagents>=0.7.28,<0.8",
    "fastapi>=0.115,<1.1",
    "fastmcp>=3.2.4,<4",
    "httpx>=0.28,<0.29",
    "langchain>=1.4.6,<2",           # deepagents 0.7.x requires langchain>=1.4.6
    "langchain-mcp-adapters>=0.2.2,<0.3",
    "langchain-openai>=1.1.12,<2",
    "langgraph>=1.2.12,<1.3",        # langchain 1.4.x requires langgraph>=1.2.12,<1.3
    "langgraph-checkpoint-mongodb>=0.4,<0.5",
    "loguru>=0.7,<0.8",
    "opensandbox>=0.1.7,<0.2",
    "pymongo>=4.12,<4.17",           # langgraph-checkpoint-mongodb 0.4.x caps pymongo<4.17
    "python-dotenv>=1.2,<2",
    "pyyaml>=6,<7",
    "requests>=2.32,<3",
    "uvicorn[standard]>=0.35,<1",    # fastmcp 3.x requires uvicorn>=0.35
    "zai-sdk>=0.2.2,<0.3",
]


[project.optional-dependencies]
# dev 工具的版本同时 pin 在 requirements.txt 里，那条锁文件路径是一步装完环境的入口。
dev = [
    "anyio>=4.7.0",
    "langgraph-cli[inmem]>=0.4.14",
    "mypy>=1.13.0",
    "pytest>=9.0.3",
    "ruff>=0.8.2",
]
# tests/test_opensanbox.py 需要 code_interpreter 模块，且没有任何包依赖它，必须显式声明。
sandbox = [
    "opensandbox-code-interpreter>=0.1.2,<0.2",
]
# 仅沙箱内使用（宿主不装）：由 global_sandbox_manager.py 在 /opt/skills-venv 里运行时安装。
scrape = [
    "beautifulsoup4>=4.12,<5",
    "lxml>=4.9",
    "markdownify>=0.12",
]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
# src/skills 与 src/download 不打包：skills 由 global_sandbox_manager.py 从源码树读取后
# 上传进沙箱，download 是运行时产物目录。两者都不是 Python 包。
include = ["agent*", "api_view*", "mcp_server*"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    # We actually do want to import from typing_extensions
    "UP035",
    # Relax the convention by _not_ requiring documentation for every function parameter.
    "D417",
    "E501",
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]
[tool.ruff.lint.pydocstyle]
convention = "google"
